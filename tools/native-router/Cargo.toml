[package]
name = "native-router"
version = "0.1.0"
edition = "2021"
description = "Local, offline car routing over an OpenStreetMap PBF extract (Pinpoint 2.0 spike)"
publish = false

# Standalone workspace: the Pinpoint root crate must not need changes for this
# spike. This also keeps `tools/native-router/target/` independent.
[workspace]

[lib]
name = "native_router"
path = "src/lib.rs"

[[bin]]
name = "native-router"
path = "src/main.rs"

[dependencies]
osmpbfreader = "0.19.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
