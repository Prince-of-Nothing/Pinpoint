[package]
name = "pinpoint-desktop"
version = "1.3.0"
edition = "2021"
description = "Privacy-first location-sharing platform in pure Rust: multiplatform client + API server (desktop + Android + iOS, OSM maps)"
publish = false

[lib]
name = "pinpoint_desktop"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pinpoint-desktop"
path = "src/main.rs"

[[bin]]
name = "pinpoint-server"
path = "src/bin/server.rs"

[[bin]]
name = "pinpoint-auth"
path = "src/bin/auth.rs"

[[bin]]
name = "pinpoint-users"
path = "src/bin/users.rs"

[[bin]]
name = "pinpoint-locations"
path = "src/bin/locations.rs"

[[bin]]
name = "pinpoint-map"
path = "src/bin/map.rs"

[[bin]]
name = "pinpoint-diag"
path = "src/bin/diag.rs"

[[bin]]
name = "pinpoint-admin"
path = "src/bin/admin.rs"

[[bin]]
name = "pinpoint-demo-client"
path = "src/bin/demo_client.rs"

[[bin]]
name = "pinpoint-web"
path = "src/bin/pinpoint-web.rs"

[[bin]]
name = "pinpoint-weba"
path = "src/bin/pinpoint-weba.rs"

[[bin]]
name = "pinpoint-webk"
path = "src/bin/pinpoint-webk.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing-subscriber = "0.3"
url = "2.5"

# Security dependencies
aead = "0.6"
aes-gcm = "0.11"
argon2 = "0.6"
base64 = { version = "0.22", features = ["std"] }
chrono = "0.4"
crypto-common = "0.1.5"
generic-array = "0.14"
hybrid-array = "0.4"
hmac = "0.12"
rand = "0.8"
sha2 = "0.10"
typenum = "1.15"
zeroize = "1.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", default-features = false, features = ["rt-multi-thread", "time", "net", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
webbrowser = "1.2"
image = { version = "0.25", default-features = false, features = ["png"] }
which = "6.0"

# API server (pure Rust, replaces archived Go backend). Native-only: the
# wasm web stubs must not compile axum/sqlx/tokio/mio.
axum = "0.7"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "tls-rustls-ring",
] }

# Desktop keeps accesskit + Linux windowing; Android uses the native activity
# backend (accesskit is only compatible with game-activity on Android).
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.32", default-features = true, features = ["glow"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
winit = "0.30"

# OS keychain: Windows Credential Manager / macOS Keychain / Linux Secret
# Service (see src/security/keychain.rs). Mobile/Web targets keep the
# FileKeychain / in-memory fallback.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
keyring = "4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlButtonElement",
  "Node",
  "Window",
  "Location",
  "UrlSearchParams",
  "Event",
  "EventTarget",
  "KeyboardEvent",
] }
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# getrandom 0.4 is pulled by aes-gcm/argon2 on the wasm targets; its wasm
# backend is opt-in and must be enabled explicitly for `cargo check`.
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tempfile = "3.6"
tower = { version = "0.4", features = ["util"] }

# Multiplatform targets (see docs/sdlc/06-technical-requirements.md):
# - Desktop: `cargo build --locked` (Windows/Linux/macOS)
# - Android: `cargo apk build --lib --target x86_64-linux-android`
#   (eframe/winit → NativeActivity; see android/README.md)
# - iOS:     `cargo xcodebuild` (eframe/winit → aarch64-apple-ios)
# The same `crate-type` serves all targets; `src/platform.rs` holds every
# `cfg(target_os)` branch so the UI core stays portable.
# - Web:     `trunk build` with `src/bin/pinpoint-web.rs` (wasm32, see `web/`)

# Linux .deb packaging (cargo-deb, optional — see packaging/linux/README).
[package.metadata.deb]
name = "pinpoint"
maintainer = "Pinpoint Team"
section = "net"
priority = "optional"
assets = [
    ["target/release/pinpoint-desktop", "/usr/bin/pinpoint-desktop", "755"],
    ["packaging/linux/pinpoint.desktop", "/usr/share/applications/pinpoint.desktop", "644"],
]
description = "Privacy-first location-sharing client (offline map-first, OSM ODbL)."

# macOS .app bundle (cargo-bundle, optional — see packaging/macos/README).
[package.metadata.bundle]
name = "Pinpoint"
identifier = "com.pinpoint.desktop"
resources = []
category = "Social Networking"
short_description = "Privacy-first location sharing (map-first, OSM)."
copyright = "MIT © 2026 Pinpoint"
# NSLocationWhenInUseUsageDescription etc. are optional: publish/share is
# manual lat/lon today; GPS requires the same entitlements as Android/iOS
# (see ios/Info.plist NSLocation* keys).

# Android APK packaging (`cargo apk build --locked`, see `android/`).
# cargo-apk 0.10 generates AndroidManifest.xml from this TOML; NativeActivity
# and the android.app.lib_name meta-data are added automatically.
[package.metadata.android]
package = "com.pinpoint.desktop"
apk_name = "pinpoint"
build_targets = ["x86_64-linux-android", "aarch64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_FINE_LOCATION"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_COARSE_LOCATION"

[package.metadata.android.application]
label = "Pinpoint"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.Material.NoActionBar"
# Debug/emulator uses http://10.0.2.2:8000. Release builds must use HTTPS.
uses_cleartext_traffic = true

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode"
launch_mode = "singleTop"
exported = true
