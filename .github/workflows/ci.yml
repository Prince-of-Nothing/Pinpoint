name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: always_together
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Static security analysis (bandit)
        run: bandit -q -c pyproject.toml -r app
      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Migrations apply cleanly on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/always_together
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing
