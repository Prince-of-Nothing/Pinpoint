# nginx gateway (HTTP, dev default) — central directory for modular Rust services.
# This file is the ONE place that knows where each service runs (Docker DNS
# name + internal port). Clients send to the gateway (:8000); the gateway
# picks ANY healthy replica.
#   auth      → auth:8001       path /api/v1/auth/
#   users     → users:8002      path /api/v1/users/ + /api/v1/friendships/
#   locations → locations:8003  path /api/v1/locations/
#   messages  → messages:8007   path /api/v1/messages
#   map       → map:8004        path /map/
#   diag      → diag:8005       path /api/v1/diagnostics/ (PII-free reports)
#   admin     → admin:8006      path /api/v1/admin/ (role-gated)
# How "takes any" works: each location uses `set $x_upstream http://name:port`
# + `proxy_pass $x_upstream` so nginx re-resolves Docker DNS (127.0.0.11)
# on EVERY request (no startup DNS cache) and round-robins the returned
# A-records. `proxy_next_upstream` retries the next replica on errors.
# Static `upstream { server name:port; }` would NOT work here: it requires
# DNS at config load (fails when services aren't up yet and never sees
# new replicas without a reload). X-Upstream header shows which replica
# served a request (proof). Live registry: GET /registry.
# Trust the TLS proxy's forwarding headers (docker-compose profile "public").
# Only the proxy's hop on the Docker network is accepted, and real_ip_recursive
# skips trusted hops, so a visitor cannot forge their address through a header.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# The scheme the visitor used: the proxy's X-Forwarded-Proto when it is set,
# otherwise the scheme this hop received (loopback HTTP during development).
map $http_x_forwarded_proto $pinpoint_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # ZAP baseline hardening (Z-1/Z-3/Z-5): headers on every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    server_tokens off;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Trust boundary: the gateway publishes only on 127.0.0.1 or sits behind
    # the TLS proxy. $remote_addr is the real visitor after the realip block
    # above, so per-client throttles key on them, not on the proxy.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $pinpoint_proto;

    # Auth service (any auth replica)
    location /api/v1/auth/ {
        set $auth_upstream http://auth:8001;
        proxy_pass $auth_upstream;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Upstream $upstream_addr always;
    }

    # Users + friendships (any users replica)
    location /api/v1/users/ {
        set $users_upstream http://users:8002;
        proxy_pass $users_upstream;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Upstream $upstream_addr always;
    }
    location /api/v1/friendships/ {
        set $users_upstream http://users:8002;
        proxy_pass $users_upstream;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Upstream $upstream_addr always;
    }

    # Locations + shares (any locations replica)
    location /api/v1/locations/ {
        set $locations_upstream http://locations:8003;
        proxy_pass $locations_upstream;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Upstream $upstream_addr always;
    }

    # E2E messages (any messages replica; public bundles + opaque envelopes)
    location /api/v1/messages {
        set $messages_upstream http://messages:8007;
        proxy_pass $messages_upstream;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Upstream $upstream_addr always;
    }

    # Map service (any map replica — tiles/attribution/health)
    location /map/ {
        set $map_upstream http://map:8004;
        proxy_pass $map_upstream;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Upstream $upstream_addr always;
    }

    # Diagnostics ingestion (PII-free reports; dedicated port 8005)
    location /api/v1/diagnostics/ {
        set $diag_upstream http://diag:8005;
        proxy_pass $diag_upstream;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Upstream $upstream_addr always;
    }

    # Admin API (role-gated; dedicated port 8006)
    location /api/v1/admin/ {
        set $admin_upstream http://admin:8006;
        proxy_pass $admin_upstream;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Upstream $upstream_addr always;
    }

    location = /registry {
        access_log off;
        add_header Content-Type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        return 200 '{"gateway":"pinpoint-gateway","services":[{"name":"auth","upstream":"auth:8001","path":"/api/v1/auth/"},{"name":"users","upstream":"users:8002","path":"/api/v1/users/,/api/v1/friendships/"},{"name":"locations","upstream":"locations:8003","path":"/api/v1/locations/"},{"name":"messages","upstream":"messages:8007","path":"/api/v1/messages"},{"name":"map","upstream":"map:8004","path":"/map/"},{"name":"diag","upstream":"diag:8005","path":"/api/v1/diagnostics/"},{"name":"admin","upstream":"admin:8006","path":"/api/v1/admin/"}]}';
    }

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 200 '{"status":"healthy","gateway":"pinpoint-gateway"}';
    }

    location / {
        add_header Content-Type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 200 '{"name":"Pinpoint API Gateway","version":"0.1.0","services":["auth","users","locations","messages","map","diag","admin","db"]}';
    }
}
