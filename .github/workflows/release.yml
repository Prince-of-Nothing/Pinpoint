# Release pipeline adapted from the ArtCraft/lightcraft-android pattern.
#
# Pushing a version tag (v1.2.1, v1.3.0-beta, ΓÇª) builds two APKs, re-signs them
# with the release key and creates a DRAFT GitHub release named after the tag
# with RELEASE_NOTES.md as the body. Publish the draft when it looks right; it
# becomes the latest release and the in-app checker sees it.
#
# A manual run (Actions ΓÇ║ Release ΓÇ║ Run workflow) is a dry run: it builds the
# APKs at the version in Cargo.toml and keeps them as the run artifact. It
# signs with a throwaway key when release secrets are absent and releases
# nothing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.0

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-beta"
            exit 1
          fi
          listed="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$v" != "$listed" ]; then
            echo "::error::the tag is v$v but Cargo.toml says version = \"$listed\": bump Cargo.toml before tagging"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "### v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - name: Install cargo-apk and the Android NDK
        run: |
          cargo install cargo-apk --version 0.10.0 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$ANDROID_NDK_VERSION" \
            "platforms;$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_BUILD_TOOLS" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >>"$GITHUB_ENV"

      - name: Prepare signing keys
        id: keys
        env:
          KEYSTORE_BASE64: ${{ secrets.PINPOINT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PINPOINT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PINPOINT_KEY_ALIAS }}
        run: |
          # cargo-apk 0.10 always signs a release build. Give it a throwaway
          # key first; the real release key re-signs the APK afterwards.
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/build.p12" \
            -alias pinpoint-build \
            -storepass build-pass \
            -keypass build-pass \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Pinpoint Build, O=Pinpoint, C=MD"
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/build.p12" >>"$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=build-pass" >>"$GITHUB_ENV"

          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.jks"
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
              echo "::error::Set PINPOINT_KEYSTORE_PASSWORD and PINPOINT_KEY_ALIAS alongside PINPOINT_KEYSTORE_BASE64."
              exit 1
            fi
            echo "PINPOINT_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >>"$GITHUB_ENV"
            echo "has_release_key=true" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::No release key: add PINPOINT_KEYSTORE_BASE64, PINPOINT_KEYSTORE_PASSWORD and PINPOINT_KEY_ALIAS. A tagged release is never signed with a throwaway key."
            exit 1
          else
            echo "::warning::No release key: this dry run is signed with a throwaway key and releases nothing."
            echo "has_release_key=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist
          chmod +x android/gradlew
          zipalign="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)zipalign"
          # One universal APK (arm64-v8a + armeabi-v7a) so users cannot pick
          # the wrong 32-bit asset on a 64-bit-only device. Gradle builds both
          # Rust .so targets via cargo-apk, packages the Java bridge/DEX and
          # returns an unsigned, unaligned release APK.
          (cd android && ./gradlew :app:assembleRelease \
            -Pabi=universal -PrustProfile=release --no-daemon)
          out="dist/pinpoint-android-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$out"
          "$zipalign" -f -p 4 "$out" "$out.aligned"
          mv "$out.aligned" "$out"

      - name: Re-sign with the release key
        if: steps.keys.outputs.has_release_key == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PINPOINT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PINPOINT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PINPOINT_KEY_PASSWORD }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          for apk in dist/*.apk; do
            args=(
              --ks "$PINPOINT_RELEASE_KEYSTORE"
              --ks-key-alias "$KEY_ALIAS"
              --ks-pass "pass:$KEYSTORE_PASSWORD"
            )
            if [ -n "$KEY_PASSWORD" ]; then
              args+=(--key-pass "pass:$KEY_PASSWORD")
            fi
            "$apksigner" sign "${args[@]}" "$apk"
          done

      - name: Verify APKs
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          echo >>"$GITHUB_STEP_SUMMARY"
          for apk in dist/*.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            if [ "$GITHUB_REF_TYPE" = tag ] && grep -q "CN=Pinpoint Build" <<<"$certs"; then
              echo "::error::$apk is still signed with the throwaway build key"
              exit 1
            fi
            {
              echo "    $(basename "$apk")"
              grep "certificate SHA-256" <<<"$certs" | sed 's/^/      /'
            } >>"$GITHUB_STEP_SUMMARY"
          done

      - name: Check release version consistency
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          ./scripts/check-release.ps1 -SkipHealth -Apk "dist/pinpoint-android-$env:VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: error

      - name: Remove signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/build.p12" "$RUNNER_TEMP/release.jks"

  windows:
    name: Windows desktop and server
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
      - name: Build release binaries
        run: cargo build --release --locked --bin pinpoint-desktop --bin pinpoint-server
      - name: Verify Windows binaries
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $helpOut = "$env:RUNNER_TEMP\pinpoint-desktop-help.out"
          $helpErr = "$env:RUNNER_TEMP\pinpoint-desktop-help.err"
          $desktop = Start-Process -FilePath "target\release\pinpoint-desktop.exe" -ArgumentList "--help" `
            -NoNewWindow -Wait -PassThru -RedirectStandardOutput $helpOut -RedirectStandardError $helpErr
          if ($desktop.ExitCode -ne 0) { throw "pinpoint-desktop --help failed" }
          $help = (Get-Content $helpOut -Raw -ErrorAction SilentlyContinue) +
            (Get-Content $helpErr -Raw -ErrorAction SilentlyContinue)
          if ($help -notmatch [regex]::Escape($version)) {
            throw "desktop --help does not report $version"
          }
          $port = 18080
          $env:BIND_ADDR = "127.0.0.1:$port"
          Remove-Item Env:DATABASE_URL -ErrorAction SilentlyContinue
          $server = Start-Process -FilePath "target/release/pinpoint-server.exe" -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\pinpoint-server.out" `
            -RedirectStandardError "$env:RUNNER_TEMP\pinpoint-server.err"
          try {
            $health = $null
            $deadline = (Get-Date).AddSeconds(30)
            while (-not $health -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:$port/health" -TimeoutSec 2
              } catch {}
            }
            if (-not $health) { throw "server did not become healthy" }
            if ($health.version -ne $version) {
              throw "server /health version '$($health.version)' != $version"
            }
            Add-Type -AssemblyName System.Net.Http
            $client = [System.Net.Http.HttpClient]::new()
            try {
              $response = $client.GetAsync("http://127.0.0.1:$port/").GetAwaiter().GetResult()
              if (-not $response.IsSuccessStatusCode) {
                throw "web client returned $([int]$response.StatusCode)"
              }
              $mediaType = $response.Content.Headers.ContentType.MediaType
              if ($mediaType -notmatch 'text/html') {
                throw "web client content type is '$mediaType'"
              }
              $privacyResponse = $client.GetAsync("http://127.0.0.1:$port/privacy").GetAwaiter().GetResult()
              if (-not $privacyResponse.IsSuccessStatusCode) {
                throw "privacy page returned $([int]$privacyResponse.StatusCode)"
              }
              $privacy = $privacyResponse.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              if ($privacy -notmatch [regex]::Escape("Version $version")) {
                throw "privacy page does not name $version"
              }
            } finally {
              $client.Dispose()
            }
            Write-Host "desktop and server report $version; /health, / and /privacy passed"
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Package desktop and server/web ZIPs
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist/desktop | Out-Null
          New-Item -ItemType Directory -Force dist/server | Out-Null
          Copy-Item target/release/pinpoint-desktop.exe dist/desktop/
          Copy-Item target/release/pinpoint-server.exe dist/server/
          (Get-Content packaging/windows-desktop-README.txt -Raw).Replace('@VERSION@', $version) |
            Set-Content dist/desktop/README.txt -NoNewline
          (Get-Content packaging/windows-server-README.txt -Raw).Replace('@VERSION@', $version) |
            Set-Content dist/server/README.txt -NoNewline
          Compress-Archive -Path dist/desktop/* -DestinationPath "dist/pinpoint-desktop-windows-x64-$version.zip" -Force
          Compress-Archive -Path dist/server/* -DestinationPath "dist/pinpoint-server-windows-x64-$version.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux desktop and server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libgl1-mesa-dri xvfb xauth zip desktop-file-utils
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux
      - name: Build release binaries
        run: cargo build --release --locked --bin pinpoint-desktop --bin pinpoint-server
      - name: Verify Linux binary
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          out="$(target/release/pinpoint-desktop --help 2>&1)"
          if ! grep -Fq "$version" <<<"$out"; then
            echo "::error::desktop --help does not report $version"
            exit 1
          fi
          echo "desktop reports $version"
      - name: Verify Linux server
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          port=18081
          BIND_ADDR="127.0.0.1:$port" target/release/pinpoint-server &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          health=""
          for _ in $(seq 1 60); do
            if health="$(curl -fsS "http://127.0.0.1:$port/health")"; then break; fi
            sleep 0.5
          done
          grep -Fq "\"version\":\"$version\"" <<<"$health"
          curl -fsS "http://127.0.0.1:$port/privacy" | grep -Fq "Version $version"
          curl -fsS "http://127.0.0.1:$port/" | grep -Fq "Pinpoint"
          echo "server serves /health, /privacy and / at $version"
      - name: Launch Linux binary under Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            target/release/pinpoint-desktop --screenshot "$RUNNER_TEMP/linux-launch.png" \
            --backend http://127.0.0.1:8080
          test -s "$RUNNER_TEMP/linux-launch.png"
          size="$(stat -c%s "$RUNNER_TEMP/linux-launch.png")"
          echo "Linux launch screenshot: $size bytes"
          test "$size" -gt 100000
      - name: Package Linux ZIPs
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          mkdir -p dist/linux dist/server
          cp target/release/pinpoint-desktop dist/linux/
          cp packaging/pinpoint.desktop dist/linux/
          cp android/res/mipmap-xxxhdpi/ic_launcher.png dist/linux/pinpoint.png
          sed "s/@VERSION@/$version/g" packaging/linux-desktop-README.txt > dist/linux/README.txt
          desktop-file-validate dist/linux/pinpoint.desktop
          (cd dist/linux && zip -j "../pinpoint-desktop-linux-x64-$version.zip" pinpoint-desktop pinpoint.desktop pinpoint.png README.txt)
          cp target/release/pinpoint-server dist/server/
          sed "s/@VERSION@/$version/g" packaging/linux-server-README.txt > dist/server/README.txt
          (cd dist/server && zip -j "../pinpoint-server-linux-x64-$version.zip" pinpoint-server README.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
      - name: Build release binary
        run: cargo build --release --locked --bin pinpoint-desktop
      - name: Verify macOS binary
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          out="$(target/release/pinpoint-desktop --help 2>&1)"
          if ! grep -Fq "$version" <<<"$out"; then
            echo "::error::desktop --help does not report $version"
            exit 1
          fi
          echo "desktop reports $version"
      - name: Package macOS ZIP
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          IFS=. read -r major minor patch <<<"$version"
          build="$((major * 10000 + minor * 100 + patch))"
          app="dist/Pinpoint.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" build
          cp target/release/pinpoint-desktop "$app/Contents/MacOS/pinpoint-desktop"
          sed -e "s/@VERSION@/$version/g" -e "s/@BUILD@/$build/g" \
            packaging/macos-Info.plist > "$app/Contents/Info.plist"
          iconset="build/Pinpoint.iconset"
          rm -rf "$iconset"
          mkdir -p "$iconset"
          src="android/res/mipmap-xxxhdpi/ic_launcher.png"
          while read -r size name; do
            sips -z "$size" "$size" "$src" --out "$iconset/$name" >/dev/null
          done <<'EOF'
          16 icon_16x16.png
          32 icon_16x16@2x.png
          32 icon_32x32.png
          64 icon_32x32@2x.png
          128 icon_128x128.png
          256 icon_128x128@2x.png
          256 icon_256x256.png
          512 icon_256x256@2x.png
          512 icon_512x512.png
          1024 icon_512x512@2x.png
          EOF
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/Pinpoint.icns"
          sed "s/@VERSION@/$version/g" packaging/macos-desktop-README.txt > dist/README.txt
          plutil -lint "$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = "$version"
          test "$(plutil -extract CFBundleVersion raw -o - "$app/Contents/Info.plist")" = "$build"
          test -f "$app/Contents/Resources/Pinpoint.icns"
          help_out="$("$app/Contents/MacOS/pinpoint-desktop" --help 2>&1 || true)"
          grep -Fq "$version" <<<"$help_out"
      - name: Launch macOS app bundle
        run: |
          open -n "$PWD/dist/Pinpoint.app" --args --backend http://127.0.0.1:8080
          sleep 5
          if ! pgrep -f "Pinpoint.app/Contents/MacOS/pinpoint-desktop" >/dev/null; then
            echo "::error::Pinpoint.app did not stay running"
            exit 1
          fi
          echo "Pinpoint.app launched"
          pkill -f "Pinpoint.app/Contents/MacOS/pinpoint-desktop" || true
      - name: Zip macOS app bundle
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          (cd dist && zip -qry "pinpoint-desktop-macos-$version.zip" Pinpoint.app README.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*.zip
          if-no-files-found: error

  verify-windows:
    name: Verify downloaded Windows apps
    needs: windows
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - name: Run the packaged desktop and server
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $desktopZip = Get-ChildItem "dist/pinpoint-desktop-windows-x64-$version.zip"
          if (-not $desktopZip) { throw "Missing desktop ZIP for $version" }
          $desktopRoot = Join-Path $env:RUNNER_TEMP "packaged-desktop"
          Remove-Item $desktopRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $desktopZip.FullName $desktopRoot
          $helpOut = "$env:RUNNER_TEMP\downloaded-desktop-help.out"
          $helpErr = "$env:RUNNER_TEMP\downloaded-desktop-help.err"
          $desktop = Start-Process -FilePath (Join-Path $desktopRoot "pinpoint-desktop.exe") -ArgumentList "--help" `
            -NoNewWindow -Wait -PassThru -RedirectStandardOutput $helpOut -RedirectStandardError $helpErr
          if ($desktop.ExitCode -ne 0) { throw "downloaded pinpoint-desktop --help failed" }
          $help = (Get-Content $helpOut -Raw -ErrorAction SilentlyContinue) +
            (Get-Content $helpErr -Raw -ErrorAction SilentlyContinue)
          if ($help -notmatch [regex]::Escape($version)) {
            throw "downloaded desktop --help does not report $version"
          }
          $zip = Get-ChildItem "dist/pinpoint-server-windows-x64-$version.zip"
          if (-not $zip) { throw "Missing server ZIP for $version" }
          $root = Join-Path $env:RUNNER_TEMP "packaged-server"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip.FullName $root
          $port = 18081
          $env:BIND_ADDR = "127.0.0.1:$port"
          Remove-Item Env:DATABASE_URL -ErrorAction SilentlyContinue
          $server = Start-Process -FilePath (Join-Path $root "pinpoint-server.exe") -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\packaged-server.out" `
            -RedirectStandardError "$env:RUNNER_TEMP\packaged-server.err"
          try {
            $health = $null
            $deadline = (Get-Date).AddSeconds(30)
            while (-not $health -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:$port/health" -TimeoutSec 2
              } catch {}
            }
            if (-not $health) { throw "downloaded server did not become healthy" }
            if ($health.version -ne $version) {
              throw "downloaded /health version '$($health.version)' != $version"
            }
            Add-Type -AssemblyName System.Net.Http
            $client = [System.Net.Http.HttpClient]::new()
            try {
              $response = $client.GetAsync("http://127.0.0.1:$port/").GetAwaiter().GetResult()
              if (-not $response.IsSuccessStatusCode) {
                throw "/ returned $([int]$response.StatusCode)"
              }
              $mediaType = $response.Content.Headers.ContentType.MediaType
              if ($mediaType -notmatch 'text/html') {
                throw "/ content type is '$mediaType'"
              }
              $privacyResponse = $client.GetAsync("http://127.0.0.1:$port/privacy").GetAwaiter().GetResult()
              if (-not $privacyResponse.IsSuccessStatusCode) {
                throw "/privacy returned $([int]$privacyResponse.StatusCode)"
              }
              $privacy = $privacyResponse.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              if ($privacy -notmatch [regex]::Escape("Version $version")) {
                throw "/privacy does not name $version"
              }
            } finally {
              $client.Dispose()
            }
            Write-Host "downloaded desktop reports $version; server serves /health and /privacy at $version and / as HTML"
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

  verify-linux:
    name: Verify downloaded Linux packages
    needs: linux
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libgl1-mesa-dri xvfb
      - name: Run the packaged desktop
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          root="$RUNNER_TEMP/linux-zip"
          rm -rf "$root"
          unzip -q "dist/pinpoint-desktop-linux-x64-$version.zip" -d "$root"
          chmod +x "$root/pinpoint-desktop"
          help_out="$("$root/pinpoint-desktop" --help 2>&1 || true)"
          grep -Fq "$version" <<<"$help_out"
          screenshot="$RUNNER_TEMP/downloaded-linux-launch.png"
          xvfb-run -a -s "-screen 0 1280x800x24" \
            "$root/pinpoint-desktop" --screenshot "$screenshot" --backend http://127.0.0.1:8080
          test -s "$screenshot"
          size="$(stat -c%s "$screenshot")"
          test "$size" -gt 100000
          echo "downloaded Linux desktop reports $version; screenshot $size bytes"
      - name: Run the packaged server
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          root="$RUNNER_TEMP/linux-server-zip"
          rm -rf "$root"
          unzip -q "dist/pinpoint-server-linux-x64-$version.zip" -d "$root"
          chmod +x "$root/pinpoint-server"
          port=18082
          BIND_ADDR="127.0.0.1:$port" "$root/pinpoint-server" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          health=""
          for _ in $(seq 1 60); do
            if health="$(curl -fsS "http://127.0.0.1:$port/health")"; then break; fi
            sleep 0.5
          done
          grep -Fq "\"version\":\"$version\"" <<<"$health"
          curl -fsS "http://127.0.0.1:$port/privacy" | grep -Fq "Version $version"
          curl -fsS "http://127.0.0.1:$port/" | grep -Fq "Pinpoint"
          echo "downloaded Linux server serves /health, /privacy and / at $version"

  verify-macos:
    name: Verify downloaded macOS app
    needs: macos
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist
      - name: Run the packaged app
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          root="$RUNNER_TEMP/macos-zip"
          rm -rf "$root"
          unzip -q "dist/pinpoint-desktop-macos-$version.zip" -d "$root"
          app="$root/Pinpoint.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = "$version"
          open -n "$app" --args --backend http://127.0.0.1:8080
          sleep 5
          if ! pgrep -f "Pinpoint.app/Contents/MacOS/pinpoint-desktop" >/dev/null; then
            echo "::error::downloaded Pinpoint.app did not stay running"
            exit 1
          fi
          echo "downloaded Pinpoint.app reports $version and stayed running"
          pkill -f "Pinpoint.app/Contents/MacOS/pinpoint-desktop" || true

  release:
    name: GitHub Release
    needs: [apk, windows, linux, macos, verify-windows, verify-linux, verify-macos]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist

      - name: Verify downloaded Windows ZIPs
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $desktopZip = "dist/pinpoint-desktop-windows-x64-$version.zip"
          $serverZip = "dist/pinpoint-server-windows-x64-$version.zip"
          if (-not (Test-Path $desktopZip)) { throw "Missing $desktopZip" }
          if (-not (Test-Path $serverZip)) { throw "Missing $serverZip" }
          $root = Join-Path $env:RUNNER_TEMP "windows-zips"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $desktopZip (Join-Path $root "desktop")
          Expand-Archive $serverZip (Join-Path $root "server")
          foreach ($entry in @(
            @{ Path = "desktop/pinpoint-desktop.exe"; Label = "desktop exe" },
            @{ Path = "desktop/README.txt"; Label = "desktop README" },
            @{ Path = "server/pinpoint-server.exe"; Label = "server exe" },
            @{ Path = "server/README.txt"; Label = "server README" }
          )) {
            if (-not (Test-Path (Join-Path $root $entry.Path))) {
              throw "Missing $($entry.Label)"
            }
          }
          $desktopReadme = Get-Content (Join-Path $root "desktop/README.txt") -Raw
          $serverReadme = Get-Content (Join-Path $root "server/README.txt") -Raw
          if ($desktopReadme -notmatch [regex]::Escape("Pinpoint $version")) {
            throw "desktop README does not report $version"
          }
          if ($serverReadme -notmatch [regex]::Escape("Pinpoint $version")) {
            throw "server README does not report $version"
          }
          Write-Host "Windows ZIPs contain the expected exes and README $version"

      - name: Verify downloaded Linux ZIP
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $zip = Get-ChildItem dist/pinpoint-desktop-linux-x64-*.zip | Select-Object -First 1
          if (-not $zip) { throw "Missing Linux desktop ZIP" }
          $root = Join-Path $env:RUNNER_TEMP "linux-zip"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip.FullName $root
          if (-not (Test-Path (Join-Path $root "pinpoint-desktop"))) {
            throw "Linux ZIP is missing pinpoint-desktop"
          }
          foreach ($name in @("pinpoint.desktop", "pinpoint.png", "README.txt")) {
            if (-not (Test-Path (Join-Path $root $name))) {
              throw "Linux ZIP is missing $name"
            }
          }
          $desktop = Get-Content (Join-Path $root "pinpoint.desktop") -Raw
          if ($desktop -notmatch 'Exec=pinpoint-desktop' -or $desktop -notmatch 'Icon=pinpoint') {
            throw "Linux desktop entry is malformed"
          }
          $readme = Get-Content (Join-Path $root "README.txt") -Raw
          if ($readme -notmatch [regex]::Escape("Pinpoint $version")) {
            throw "Linux README does not report $version"
          }
          Write-Host "Linux ZIP contains binary, desktop entry, icon and README $version"

      - name: Verify downloaded Linux server ZIP
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $zip = "dist/pinpoint-server-linux-x64-$version.zip"
          if (-not (Test-Path $zip)) { throw "Missing $zip" }
          $root = Join-Path $env:RUNNER_TEMP "linux-server-zip"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip $root
          if (-not (Test-Path (Join-Path $root "pinpoint-server"))) {
            throw "Linux server ZIP is missing pinpoint-server"
          }
          $readme = Get-Content (Join-Path $root "README.txt") -Raw
          if ($readme -notmatch [regex]::Escape("Pinpoint $version")) {
            throw "Linux server README does not report $version"
          }
          Write-Host "Linux server ZIP contains pinpoint-server and README $version"

      - name: Verify downloaded macOS ZIP
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $zip = Get-ChildItem dist/pinpoint-desktop-macos-*.zip | Select-Object -First 1
          if (-not $zip) { throw "Missing macOS desktop ZIP" }
          $root = Join-Path $env:RUNNER_TEMP "macos-zip"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip.FullName $root
          $app = Join-Path $root "Pinpoint.app"
          $binary = Join-Path $app "Contents/MacOS/pinpoint-desktop"
          $plistPath = Join-Path $app "Contents/Info.plist"
          $icon = Join-Path $app "Contents/Resources/Pinpoint.icns"
          if (-not (Test-Path $binary)) { throw "macOS app is missing its executable" }
          if (-not (Test-Path $icon)) { throw "macOS app is missing its icon" }
          if (-not (Test-Path $plistPath)) { throw "macOS app is missing Info.plist" }
          $plist = Get-Content $plistPath -Raw
          if ($plist -notmatch "<key>CFBundleShortVersionString</key>\s*<string>$([regex]::Escape($version))</string>") {
            throw "macOS Info.plist version does not match $version"
          }
          $parts = $version.Split('.')
          $build = [int]$parts[0] * 10000 + [int]$parts[1] * 100 + [int]$parts[2]
          if ($plist -notmatch "<key>CFBundleVersion</key>\s*<string>$build</string>") {
            throw "macOS Info.plist build does not match $build"
          }
          $readme = Get-Content (Join-Path $root "README.txt") -Raw
          if ($readme -notmatch [regex]::Escape("Pinpoint $version")) {
            throw "macOS README does not report $version"
          }
          Write-Host "macOS ZIP contains Pinpoint.app $version ($build), icon and README"

      - name: Install Android build-tools (aapt)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;$ANDROID_BUILD_TOOLS" >/dev/null

      - name: Verify the downloaded draft APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem dist/*.apk | Select-Object -First 1
          if (-not $apk) { throw "No APK in dist/" }
          ./scripts/check-release.ps1 -SkipHealth -Apk $apk.FullName

      - name: Verify the downloaded APK signature
        shell: bash
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          apk="$(ls dist/*.apk | head -n 1)"
          certs="$("$apksigner" verify --print-certs "$apk")"
          if [ "$GITHUB_REF_TYPE" = tag ] && grep -q "CN=Pinpoint Build" <<<"$certs"; then
            echo "::error::$apk is still signed with the throwaway build key"
            exit 1
          fi
          echo "APK signature valid: $(grep 'certificate DN' <<<"$certs")"

      - name: Draft the release
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            -- dist/*
          echo "Draft **$GITHUB_REF_NAME** is ready: review the notes and publish it." >>"$GITHUB_STEP_SUMMARY"
