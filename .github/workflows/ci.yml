name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Rust multiplatform client (root crate): format, lints, locked build,
    # unit + API-contract tests, and a dependency audit.
    # Includes desktop/mobile-shared core and web app bins (web/weba/webk stubs).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system dependencies (egui/winit link, reqwest TLS)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (locked)
        run: cargo build --locked
      - name: Build web app bins (native stubs)
        run: cargo build --locked --bin pinpoint-web --bin pinpoint-weba --bin pinpoint-webk
      - name: Tests (locked) — unit + API contract
        run: cargo test --locked
      - name: Release version consistency
        shell: pwsh
        run: |
          $env:BIND_ADDR = "127.0.0.1:8080"
          Remove-Item Env:DATABASE_URL -ErrorAction SilentlyContinue
          $server = Start-Process -FilePath "./target/debug/pinpoint-server" -PassThru
          try {
            $health = $null
            $deadline = (Get-Date).AddSeconds(30)
            while (-not $health -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8080/health" -TimeoutSec 2
              } catch {}
            }
            if (-not $health) { throw "pinpoint-server did not become healthy" }
            ./scripts/check-release.ps1 -Base http://127.0.0.1:8080 -SkipApk
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Dependency vulnerability audit (cargo-audit)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Accepted risk, mirrored in audit.toml: unmaintained/unsound
          # transitive crates with no fixed upgrade in the current tree.
          ignore: RUSTSEC-2026-0543,RUSTSEC-2024-0436,RUSTSEC-2024-0370,RUSTSEC-2026-0249,RUSTSEC-2026-0192,RUSTSEC-2026-0371,RUSTSEC-2026-0370,RUSTSEC-2026-0372,RUSTSEC-2024-0429

  web-tests:
    # Pure Node checks for the web client: sharing consent helpers, the
    # admin users form wiring, the message poll guard and the password
    # minimum. No browser or network required.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sharing UI checks
        run: node web/app/test/sharing-ui.mjs
      - name: Admin UI checks
        run: node web/app/test/admin-ui.mjs
      - name: Message poll checks
        run: node web/app/test/messages-poll.mjs
      - name: Friends/sharing poll checks
        run: node web/app/test/social-poll.mjs
      - name: Map layer checks
        run: node web/app/test/map-layers.mjs
      - name: Search feedback checks
        run: node web/app/test/search-feedback.mjs
      - name: Password length checks
        run: node web/app/test/password-length.mjs
      - name: Navigation checks
        run: node web/app/test/navigation-ui.mjs
      - name: Drawer dismissal checks
        run: node web/app/test/drawer-dismiss.mjs
      - name: Search shortcut checks
        run: node web/app/test/search-shortcut.mjs
      - name: OAuth UI checks
        run: node web/app/test/oauth-ui.mjs

  web-live:
    # Headless Chromium against the served web client: the "/" shortcut must
    # focus search only when the field, modifiers and open surfaces allow it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build server
        run: cargo build --locked --bin pinpoint-server
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          BIND_ADDR=127.0.0.1:8080 target/debug/pinpoint-server &
          echo $! >"$RUNNER_TEMP/pinpoint-server.pid"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then exit 0; fi
            sleep 0.5
          done
          echo "::error::pinpoint-server did not become healthy"
          exit 1
      - name: Search shortcut live check
        run: node web/app/test/live-search-shortcut.cjs
      - name: Web drawer live check
        run: node web/app/test/live-web-drawer.cjs
      - name: Stop server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/pinpoint-server.pid")" 2>/dev/null || true

  wasm:
    # Compile-check web clients for wasm32 (Trunk entry bins + wasm cfg paths).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      - name: Check web bins for wasm32
        run: |
          cargo check --locked --target wasm32-unknown-unknown \
            --bin pinpoint-web --bin pinpoint-weba --bin pinpoint-webk

  client-macos:
    # macOS desktop build — same `src/` as Linux/Windows via eframe.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (locked)
        run: cargo build --locked
      - name: Tests (locked) — unit + API contract
        run: cargo test --locked
      - name: Build web app bins (native stubs)
        run: cargo build --locked --bin pinpoint-web --bin pinpoint-weba --bin pinpoint-webk
      - name: Upload macOS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinpoint-desktop-macos
          path: target/release/pinpoint-desktop
          if-no-files-found: warn

  release-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release binary
        run: cargo build --release --locked --bin pinpoint-desktop
      - name: Package artifact
        shell: pwsh
        run: |
          $zipPath = "pinpoint-desktop-windows.zip"
          $exePath = "target/release/pinpoint-desktop.exe"
          if (-not (Test-Path $exePath)) { throw "Missing binary: $exePath" }
          Compress-Archive -Path $exePath -DestinationPath $zipPath -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinpoint-desktop-windows
          path: pinpoint-desktop-windows.zip
          if-no-files-found: error
