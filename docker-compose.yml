# Default stack: Go API and web client.
#   docker compose up --build
#
# Optional Python/FastAPI stack:
#   docker compose --profile python up --build python-api
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: always-together/backend:latest
    restart: unless-stopped
    environment:
      PORT: "8000"
      APP_NAME: "Always Together API"
      DEBUG: "false"
      COOKIE_INSECURE: "true"
      SEED_DEMO_DATA: "true"
      ALLOWED_ORIGINS: "http://localhost:8080,http://localhost:3000"
      SECRET_KEY: "change-me-in-production-min-32-characters-long!!"
    expose:
      - "8000"
    ports:
      - "127.0.0.1:9000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: ./web
    image: always-together/web:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  db:
    image: postgres:16-alpine
    profiles: ["python", "https"]
    environment:
      POSTGRES_DB: always_together
      POSTGRES_USER: always_together
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-dev-runtime}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U always_together -d always_together"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["python", "https"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  python-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.python
    image: always-together/python-api:latest
    profiles: ["python", "https"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://app_runtime:${APP_DB_PASSWORD:-local-dev-runtime}@db:5432/always_together
      MIGRATION_DATABASE_URL: postgresql+psycopg://always_together:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/always_together
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-local-dev-only-secret-change-me-for-anything-public}
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: ""
    ports:
      - "127.0.0.1:8001:8000"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    depends_on:
      - python-api
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "127.0.0.1:8443:443"

volumes:
  db-data:
  caddy-data:
