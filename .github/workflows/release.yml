# Release pipeline adapted from the ArtCraft/lightcraft-android pattern.
#
# Pushing a version tag (v1.2.1, v1.3.0-beta, ΓÇª) builds two APKs, re-signs them
# with the release key and creates a DRAFT GitHub release named after the tag
# with RELEASE_NOTES.md as the body. Publish the draft when it looks right; it
# becomes the latest release and the in-app checker sees it.
#
# A manual run (Actions ΓÇ║ Release ΓÇ║ Run workflow) is a dry run: it builds the
# APKs at the version in Cargo.toml and keeps them as the run artifact. It
# signs with a throwaway key when release secrets are absent and releases
# nothing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.0

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-beta"
            exit 1
          fi
          listed="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$v" != "$listed" ]; then
            echo "::error::the tag is v$v but Cargo.toml says version = \"$listed\": bump Cargo.toml before tagging"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "### v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - name: Install cargo-apk and the Android NDK
        run: |
          cargo install cargo-apk --version 0.10.0 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$ANDROID_NDK_VERSION" \
            "platforms;$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_BUILD_TOOLS" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >>"$GITHUB_ENV"

      - name: Prepare signing keys
        id: keys
        env:
          KEYSTORE_BASE64: ${{ secrets.PINPOINT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PINPOINT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PINPOINT_KEY_ALIAS }}
        run: |
          # cargo-apk 0.10 always signs a release build. Give it a throwaway
          # key first; the real release key re-signs the APK afterwards.
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/build.p12" \
            -alias pinpoint-build \
            -storepass build-pass \
            -keypass build-pass \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Pinpoint Build, O=Pinpoint, C=MD"
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/build.p12" >>"$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=build-pass" >>"$GITHUB_ENV"

          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.jks"
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
              echo "::error::Set PINPOINT_KEYSTORE_PASSWORD and PINPOINT_KEY_ALIAS alongside PINPOINT_KEYSTORE_BASE64."
              exit 1
            fi
            echo "PINPOINT_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >>"$GITHUB_ENV"
            echo "has_release_key=true" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::No release key: add PINPOINT_KEYSTORE_BASE64, PINPOINT_KEYSTORE_PASSWORD and PINPOINT_KEY_ALIAS. A tagged release is never signed with a throwaway key."
            exit 1
          else
            echo "::warning::No release key: this dry run is signed with a throwaway key and releases nothing."
            echo "has_release_key=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist
          chmod +x android/gradlew
          zipalign="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)zipalign"
          # One universal APK (arm64-v8a + armeabi-v7a) so users cannot pick
          # the wrong 32-bit asset on a 64-bit-only device. Gradle builds both
          # Rust .so targets via cargo-apk, packages the Java bridge/DEX and
          # returns an unsigned, unaligned release APK.
          (cd android && ./gradlew :app:assembleRelease \
            -Pabi=universal -PrustProfile=release --no-daemon)
          out="dist/pinpoint-android-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$out"
          "$zipalign" -f -p 4 "$out" "$out.aligned"
          mv "$out.aligned" "$out"

      - name: Re-sign with the release key
        if: steps.keys.outputs.has_release_key == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PINPOINT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PINPOINT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PINPOINT_KEY_PASSWORD }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          for apk in dist/*.apk; do
            args=(
              --ks "$PINPOINT_RELEASE_KEYSTORE"
              --ks-key-alias "$KEY_ALIAS"
              --ks-pass "pass:$KEYSTORE_PASSWORD"
            )
            if [ -n "$KEY_PASSWORD" ]; then
              args+=(--key-pass "pass:$KEY_PASSWORD")
            fi
            "$apksigner" sign "${args[@]}" "$apk"
          done

      - name: Verify APKs
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          echo >>"$GITHUB_STEP_SUMMARY"
          for apk in dist/*.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            if [ "$GITHUB_REF_TYPE" = tag ] && grep -q "CN=Pinpoint Build" <<<"$certs"; then
              echo "::error::$apk is still signed with the throwaway build key"
              exit 1
            fi
            {
              echo "    $(basename "$apk")"
              grep "certificate SHA-256" <<<"$certs" | sed 's/^/      /'
            } >>"$GITHUB_STEP_SUMMARY"
          done

      - name: Check release version consistency
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          ./scripts/check-release.ps1 -SkipHealth -Apk "dist/pinpoint-android-$env:VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: error

      - name: Remove signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/build.p12" "$RUNNER_TEMP/release.jks"

  windows:
    name: Windows desktop and server
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
      - name: Build release binaries
        run: cargo build --release --locked --bin pinpoint-desktop --bin pinpoint-server
      - name: Verify Windows binaries
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $helpOut = "$env:RUNNER_TEMP\pinpoint-desktop-help.out"
          $helpErr = "$env:RUNNER_TEMP\pinpoint-desktop-help.err"
          $desktop = Start-Process -FilePath "target\release\pinpoint-desktop.exe" -ArgumentList "--help" `
            -NoNewWindow -Wait -PassThru -RedirectStandardOutput $helpOut -RedirectStandardError $helpErr
          if ($desktop.ExitCode -ne 0) { throw "pinpoint-desktop --help failed" }
          $help = (Get-Content $helpOut -Raw -ErrorAction SilentlyContinue) +
            (Get-Content $helpErr -Raw -ErrorAction SilentlyContinue)
          if ($help -notmatch [regex]::Escape($version)) {
            throw "desktop --help does not report $version"
          }
          $port = 18080
          $env:BIND_ADDR = "127.0.0.1:$port"
          Remove-Item Env:DATABASE_URL -ErrorAction SilentlyContinue
          $server = Start-Process -FilePath "target/release/pinpoint-server.exe" -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\pinpoint-server.out" `
            -RedirectStandardError "$env:RUNNER_TEMP\pinpoint-server.err"
          try {
            $health = $null
            $deadline = (Get-Date).AddSeconds(30)
            while (-not $health -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:$port/health" -TimeoutSec 2
              } catch {}
            }
            if (-not $health) { throw "server did not become healthy" }
            if ($health.version -ne $version) {
              throw "server /health version '$($health.version)' != $version"
            }
            Add-Type -AssemblyName System.Net.Http
            $client = [System.Net.Http.HttpClient]::new()
            try {
              $response = $client.GetAsync("http://127.0.0.1:$port/").GetAwaiter().GetResult()
              if (-not $response.IsSuccessStatusCode) {
                throw "web client returned $([int]$response.StatusCode)"
              }
              $mediaType = $response.Content.Headers.ContentType.MediaType
              if ($mediaType -notmatch 'text/html') {
                throw "web client content type is '$mediaType'"
              }
            } finally {
              $client.Dispose()
            }
            Write-Host "desktop and server report $version; /health and / passed"
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Package desktop and server/web ZIPs
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist/desktop | Out-Null
          New-Item -ItemType Directory -Force dist/server | Out-Null
          Copy-Item target/release/pinpoint-desktop.exe dist/desktop/
          Copy-Item target/release/pinpoint-server.exe dist/server/
          (Get-Content packaging/windows-desktop-README.txt -Raw).Replace('@VERSION@', $version) |
            Set-Content dist/desktop/README.txt -NoNewline
          (Get-Content packaging/windows-server-README.txt -Raw).Replace('@VERSION@', $version) |
            Set-Content dist/server/README.txt -NoNewline
          Compress-Archive -Path dist/desktop/* -DestinationPath "dist/pinpoint-desktop-windows-x64-$version.zip" -Force
          Compress-Archive -Path dist/server/* -DestinationPath "dist/pinpoint-server-windows-x64-$version.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [apk, windows]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist

      - name: Verify downloaded Windows ZIPs
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $desktopZip = "dist/pinpoint-desktop-windows-x64-$version.zip"
          $serverZip = "dist/pinpoint-server-windows-x64-$version.zip"
          if (-not (Test-Path $desktopZip)) { throw "Missing $desktopZip" }
          if (-not (Test-Path $serverZip)) { throw "Missing $serverZip" }
          $root = Join-Path $env:RUNNER_TEMP "windows-zips"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $desktopZip (Join-Path $root "desktop")
          Expand-Archive $serverZip (Join-Path $root "server")
          foreach ($entry in @(
            @{ Path = "desktop/pinpoint-desktop.exe"; Label = "desktop exe" },
            @{ Path = "desktop/README.txt"; Label = "desktop README" },
            @{ Path = "server/pinpoint-server.exe"; Label = "server exe" },
            @{ Path = "server/README.txt"; Label = "server README" }
          )) {
            if (-not (Test-Path (Join-Path $root $entry.Path))) {
              throw "Missing $($entry.Label)"
            }
          }
          $desktopReadme = Get-Content (Join-Path $root "desktop/README.txt") -Raw
          $serverReadme = Get-Content (Join-Path $root "server/README.txt") -Raw
          if ($desktopReadme -notmatch [regex]::Escape("Pinpoint $version")) {
            throw "desktop README does not report $version"
          }
          if ($serverReadme -notmatch [regex]::Escape("Pinpoint $version")) {
            throw "server README does not report $version"
          }
          Write-Host "Windows ZIPs contain the expected exes and README $version"

      - name: Install Android build-tools (aapt)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;$ANDROID_BUILD_TOOLS" >/dev/null

      - name: Verify the downloaded draft APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem dist/*.apk | Select-Object -First 1
          if (-not $apk) { throw "No APK in dist/" }
          ./scripts/check-release.ps1 -SkipHealth -Apk $apk.FullName

      - name: Draft the release
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            -- dist/*
          echo "Draft **$GITHUB_REF_NAME** is ready: review the notes and publish it." >>"$GITHUB_STEP_SUMMARY"
