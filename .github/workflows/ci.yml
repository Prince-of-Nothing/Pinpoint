name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: always_together
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Static security analysis (bandit)
        run: bandit -q -c pyproject.toml -r app
      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Migrations apply cleanly on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/always_together
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  backend-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: always_together
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Tests (memory + Postgres drivers)
        env:
          # Drives the store conformance suite against real PostgreSQL
          # (board T01); memory-driver tests always run.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/always_together?sslmode=disable
        run: go test ./...

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android SDK platform 35
        run: |
          # Ubuntu runners ship cmdline-tools; install the platform the
          # project compiles against.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Unit tests (JVM modules)
        run: gradle :core:domain:test :core:network:test --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
