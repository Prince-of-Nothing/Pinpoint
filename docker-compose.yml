# docker-compose.yml — Pure-Rust modular stack (HA-ready)
#
# Everything is Rust:
#   gateway  → nginx, the CENTRAL directory (see docs/service-discovery.md):
#     routes /api/v1/auth, /api/v1/users, /api/v1/locations, /map and picks
#     ANY healthy replica via per-request Docker-DNS + proxy_next_upstream
#     retries. Live registry: GET /registry. X-Upstream shows the replica.
#   auth     → pinpoint-auth (src/bin/auth.rs, internal :8001)
#   users    → pinpoint-users (src/bin/users.rs, internal :8002)
#   locations→ pinpoint-locations (src/bin/locations.rs, internal :8003)
#   messages → pinpoint-messages (src/bin/messages.rs, internal :8007)
#   map      → pinpoint-map (src/bin/map.rs, internal :8004, stateless)
#   db       → Postgres 16 (single primary; dumps every 5 min to pinpoint-backups)
#   db-backup→ pg_dump loop (point-in-time recovery if the primary dies)
#   client   → desktop GUI image (profile "client", Linux X11 host only)
#
# Redundancy: each service runs `scale: 2` replicas by default
# (honoured by `docker compose up`; Swarm uses `deploy.replicas`).
# Kill one replica and requests keep working via the surviving one:
#   docker compose ps
#   docker compose up --scale auth=3 --scale locations=2
# Clients only ever talk to the gateway (:8000/:8443); direct service
# ports are intentionally NOT published so replicas don't collide on host
# ports. Debug a single replica with:
#   docker compose run --rm --no-deps -p 8001:8001 auth
#
# Usage:
#   docker compose up --build -d
#   docker compose ps
#   Invoke-RestMethod http://127.0.0.1:8000/health
#
# NOTE: Postgres stays a single primary (connected-DB by design). Full DB
# HA (streaming replica / Patroni) is the production step beyond this
# file — see docs/redundancy.md. The pg_dump backup here covers
# point-in-time recovery; the service replicas cover process failure.

services:
  ###########################################################################
  # db — Postgres 16 with persistent storage
  ###########################################################################
  db:
    image: postgres:16-alpine
    container_name: pinpoint-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pinpoint
      POSTGRES_USER: pinpoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AUTH_DB_PWD: ${AUTH_DB_PWD:?Set AUTH_DB_PWD in .env}
      USERS_DB_PWD: ${USERS_DB_PWD:?Set USERS_DB_PWD in .env}
      LOCATIONS_DB_PWD: ${LOCATIONS_DB_PWD:?Set LOCATIONS_DB_PWD in .env}
      MESSAGES_DB_PWD: ${MESSAGES_DB_PWD:?Set MESSAGES_DB_PWD in .env}
      DIAG_DB_PWD: ${DIAG_DB_PWD:?Set DIAG_DB_PWD in .env}
    volumes:
      - pinpoint-db-data:/var/lib/postgresql/data
      # Per-service least-privilege roles (db/init/01-roles.sh runs once).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinpoint -d pinpoint"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pinpoint-net
    ports:
      - "127.0.0.1:5432:5432"

  ###########################################################################
  # db-backup — periodic pg_dump (point-in-time recovery)
  ###########################################################################
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        apk add --no-cache openssl >/dev/null || { echo "pinpoint db-backup: cannot install openssl"; exit 1; };
        set -o pipefail;
        echo "pinpoint db-backup: encrypted pg_dump every 300s (keep last 24)";
        while true; do
          ts=$$(date +%Y%m%dT%H%M%S);
          if pg_dump -Fc -h db -U pinpoint -d pinpoint | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PINPOINT_BACKUP_PASSPHRASE -out /backups/pinpoint-$$ts.dump.enc; then echo "backup $$ts ok"; else echo "backup $$ts FAILED"; fi;
          ls -1t /backups/*.dump.enc 2>/dev/null | tail -n +25 | xargs -r rm -f;
          sleep 300;
        done
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PINPOINT_BACKUP_PASSPHRASE: ${PINPOINT_BACKUP_PASSPHRASE:?Set PINPOINT_BACKUP_PASSPHRASE in .env}
    volumes:
      - pinpoint-backups:/backups
    networks:
      - pinpoint-net

  ###########################################################################
  # auth — Rust auth service (login/register/session), 2 replicas
  ###########################################################################
  auth:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-auth
    image: pinpoint:pinpoint-auth
    restart: unless-stopped
    scale: 2
    deploy:
      replicas: 2
    environment:
      TRUST_PROXY: "1"   # behind the bundled gateway, which overwrites X-Forwarded-For
      BIND_ADDR: 0.0.0.0:8001
      INTERNAL_PORT: "8001"
      DATABASE_URL: postgresql://pinpoint_auth:${AUTH_DB_PWD:?Set AUTH_DB_PWD in .env}@db:5432/pinpoint
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pinpoint-net
    expose:
      - "8001"

  ###########################################################################
  # users — Rust users + friendships service, 2 replicas
  ###########################################################################
  users:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-users
    image: pinpoint:pinpoint-users
    restart: unless-stopped
    scale: 2
    deploy:
      replicas: 2
    environment:
      TRUST_PROXY: "1"   # behind the bundled gateway, which overwrites X-Forwarded-For
      BIND_ADDR: 0.0.0.0:8002
      INTERNAL_PORT: "8002"
      DATABASE_URL: postgresql://pinpoint_users:${USERS_DB_PWD:?Set USERS_DB_PWD in .env}@db:5432/pinpoint
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pinpoint-net
    expose:
      - "8002"

  ###########################################################################
  # locations — Rust locations + shares service, 2 replicas
  ###########################################################################
  locations:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-locations
    image: pinpoint:pinpoint-locations
    restart: unless-stopped
    scale: 2
    deploy:
      replicas: 2
    environment:
      TRUST_PROXY: "1"   # behind the bundled gateway, which overwrites X-Forwarded-For
      BIND_ADDR: 0.0.0.0:8003
      INTERNAL_PORT: "8003"
      DATABASE_URL: postgresql://pinpoint_locations:${LOCATIONS_DB_PWD:?Set LOCATIONS_DB_PWD in .env}@db:5432/pinpoint
      PHOTO_NOTE_MAX_COUNT: ${PHOTO_NOTE_MAX_COUNT:-200}
      PHOTO_NOTE_MAX_MB: ${PHOTO_NOTE_MAX_MB:-500}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pinpoint-net
    expose:
      - "8003"

  ###########################################################################
  # messages — E2E message service (public bundles + opaque envelopes)
  # Holds no plaintext: X25519/Ed25519 public keys, sealed messages, read state.
  ###########################################################################
  messages:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-messages
    image: pinpoint:pinpoint-messages
    restart: unless-stopped
    scale: 2
    deploy:
      replicas: 2
    environment:
      TRUST_PROXY: "1"   # behind the bundled gateway, which overwrites X-Forwarded-For
      BIND_ADDR: 0.0.0.0:8007
      INTERNAL_PORT: "8007"
      DATABASE_URL: postgresql://pinpoint_messages:${MESSAGES_DB_PWD:?Set MESSAGES_DB_PWD in .env}@db:5432/pinpoint
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8007/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pinpoint-net
    expose:
      - "8007"

  ###########################################################################
  # map — Rust map service (tiles proxy + attribution + health, OSM ODbL)
  # Stateless — the safest service to scale; tile cache is per-process.
  ###########################################################################
  map:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-map
    image: pinpoint:pinpoint-map
    restart: unless-stopped
    scale: 2
    deploy:
      replicas: 2
    environment:
      TRUST_PROXY: "1"   # behind the bundled gateway, which overwrites X-Forwarded-For
      BIND_ADDR: 0.0.0.0:8004
      INTERNAL_PORT: "8004"
      # Free CARTO Basemaps key (https://carto.com/basemaps/apikey) — required
      # for tile proxy live 200s since CARTO gates keyless access.
      CARTO_API_KEY: ${CARTO_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8004/map/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pinpoint-net
    expose:
      - "8004"

  ###########################################################################
  # diag — diagnostics ingestion service (:8005), PII-free reports only
  ###########################################################################
  diag:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-diag
    image: pinpoint:pinpoint-diag
    container_name: pinpoint-diag
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"   # behind the bundled gateway, which overwrites X-Forwarded-For
      BIND_ADDR: 0.0.0.0:8005
      INTERNAL_PORT: "8005"
      DATABASE_URL: postgresql://pinpoint_diag:${DIAG_DB_PWD:?Set DIAG_DB_PWD in .env}@db:5432/pinpoint
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8005/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pinpoint-net
    ports:
      - "127.0.0.1:8005:8005"

  ###########################################################################
  # admin — dedicated admin API (:8006), every route role-gated
  ###########################################################################
  admin:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-admin
    image: pinpoint:pinpoint-admin
    container_name: pinpoint-admin
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"   # behind the bundled gateway, which overwrites X-Forwarded-For
      BIND_ADDR: 0.0.0.0:8006
      INTERNAL_PORT: "8006"
      DATABASE_URL: postgresql://pinpoint_users:${USERS_DB_PWD:?Set USERS_DB_PWD in .env}@db:5432/pinpoint
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8006/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pinpoint-net
    ports:
      - "127.0.0.1:8006:8006"

  ###########################################################################
  # gateway — nginx reverse proxy (single entrypoint for clients)
  # Single container today; `restart: unless-stopped` covers crash recovery.
  # Two gateways behind your own LB is the production step (published port
  # can't be shared) — see docs/redundancy.md.
  ###########################################################################
  gateway:
    image: nginx:1.27-alpine
    container_name: pinpoint-gateway
    restart: unless-stopped
    volumes:
      # HTTP dev profile (default). HTTPS profile: use -f docker-compose.https.yml
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      users:
        condition: service_healthy
      locations:
        condition: service_healthy
      messages:
        condition: service_healthy
      map:
        condition: service_healthy
      diag:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - pinpoint-net
    # Loopback only. Public HTTPS goes through the caddy service (profile "public").
    ports:
      - "127.0.0.1:8000:80"
      - "127.0.0.1:8443:443"

  ###########################################################################
  # caddy — public HTTPS entrypoint (profile "public" only)
  # Start with: docker compose --profile public up -d
  # Set PINPOINT_DOMAIN in .env to a hostname whose DNS points at this host.
  # Caddy obtains and renews the certificate itself. It is the only container
  # that publishes ports 80 and 443; the gateway stays on 127.0.0.1.
  ###########################################################################
  caddy:
    profiles: ["public"]
    image: caddy:2-alpine
    container_name: pinpoint-caddy
    restart: unless-stopped
    environment:
      PINPOINT_DOMAIN: ${PINPOINT_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - pinpoint-net
    ports:
      - "80:80"
      - "443:443"

  ###########################################################################
  # client — Rust desktop GUI (profile "client", Linux X11 host only)
  # Usage: docker compose --profile client run --rm client
  ###########################################################################
  client:
    profiles: ["client"]
    build:
      context: .
      dockerfile: Dockerfile.client
      target: runtime
    image: pinpoint-desktop:latest
    container_name: pinpoint-client
    environment:
      - PINPOINT_BACKEND=http://gateway:80
      - PINPOINT_ALLOW_PLAINTEXT_HOSTS=gateway
      - PINPOINT_DATA_DIR=/home/pinpoint/.pinpoint
      - DISPLAY=${DISPLAY:-:0}
    user: "1000:1000"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - pinpoint-data:/home/pinpoint/.pinpoint
    networks:
      - pinpoint-net

networks:
  pinpoint-net:
    driver: bridge

volumes:
  pinpoint-db-data:
    driver: local
  pinpoint-backups:
    driver: local
  pinpoint-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
