# Local development / demonstration stack: API + PostgreSQL + Redis.
#   docker compose up --build                  ->  http://localhost:8000/
#   docker compose --profile https up --build  ->  https://localhost:8443/ (Caddy, internal CA)
#
# The defaults below are for local use only. Set POSTGRES_PASSWORD,
# APP_DB_PASSWORD and SECRET_KEY (e.g. in a .env file) for anything shared.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: always_together
      POSTGRES_USER: always_together
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-dev-runtime}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U always_together -d always_together"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      # The API runs as the restricted runtime role; migrations run as the owner
      DATABASE_URL: postgresql+psycopg://app_runtime:${APP_DB_PASSWORD:-local-dev-runtime}@db:5432/always_together
      MIGRATION_DATABASE_URL: postgresql+psycopg://always_together:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/always_together
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-local-dev-only-secret-change-me-for-anything-public}
      # Browsers accept Secure cookies on http://localhost; set to false for other plain-http hosts
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FORWARDED_ALLOW_IPS: 172.28.0.10
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      internal:
        ipv4_address: 172.28.0.20

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    depends_on: [api]
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "127.0.0.1:8443:443"
    networks:
      internal:
        ipv4_address: 172.28.0.10

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  db-data:
  caddy-data:
